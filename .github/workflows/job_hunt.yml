name: H1B Job Hunt - Every 12 Hours

on:
  schedule:
    - cron: "0 6,18 * * *"    # 6 AM and 6 PM UTC = 2 AM / 2 PM ET
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the seen-jobs list and Excel tracker from previous runs
      - name: Restore persisted output
        uses: actions/cache@v4
        with:
          path: output/
          key: job-output-${{ github.run_id }}
          restore-keys: |
            job-output-

      - name: Create output dir
        run: mkdir -p output config

      # Resume is downloaded at runtime via RESUME_URL - nothing to do here

      - name: Run job hunt pipeline
        env:
          YOUR_NAME:         ${{ secrets.YOUR_NAME }}
          YOUR_EMAIL:        ${{ secrets.YOUR_EMAIL }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          RESUME_URL:        ${{ secrets.RESUME_URL }}
        run: python job_hunter.py

      # Upload the Excel tracker as a downloadable artifact
      - name: Upload Excel tracker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-${{ github.run_number }}
          path: output/job_tracker.xlsx
          retention-days: 30

      # Save seen_jobs.json so next run doesn't re-process old jobs
      - name: Save persisted output
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/
          key: job-output-${{ github.run_id }}
