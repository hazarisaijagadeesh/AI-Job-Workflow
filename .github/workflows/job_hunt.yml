name: H1B Job Hunt - Every 12 Hours
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python job_hunter.py
        env:
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_EMAIL: ${{ secrets.YOUR_EMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RESUME_URL: ${{ secrets.RESUME_URL }}

