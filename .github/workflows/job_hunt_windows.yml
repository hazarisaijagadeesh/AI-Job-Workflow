name: Job Hunt Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'

jobs:
  run-job-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create required directories
        run: mkdir -p output config
      - name: Run job hunter
        run: python job_hunter.py
        env:
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_EMAIL: ${{ secrets.YOUR_EMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RESUME_URL: ${{ secrets.RESUME_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_PDF_B64: ${{ secrets.RESUME_PDF_B64 }}
      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-${{ github.run_number }}
          path: output/job_tracker.xlsx
          retention-days: 30
